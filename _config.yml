# Jekyll Configuration for GitHub Pages
# Forces GitHub Pages to serve index.html as the homepage
# instead of rendering README.md

# Site settings
title: "CS-12 Wi-Fi Security Assessment"
description: "3MTT NextGen Cohort Capstone Project by Adama Nuhu"
author: "Adama Nuhu"

# Force index.html as the homepage
# This prevents Jekyll from auto-generating a page from README.md
indexpage: "index.html"

# Exclude files from processing
# Prevents README.md from being converted to index.html by Jekyll
exclude:
  - README.md
  - CS12_WiFi_Security_Assessment_Report.md
  - CS12_Walkthrough_Video_Script.md
  - 3MTT_Submission_Form_Adam_Nuhu.md
  - LinkedIn_Profile_Content.md
  - ".gitignore"

# Keep these files exactly as-is (don't process through Jekyll)
keep_files:
  - index.html

# Disable Jekyll's default behavior of rendering README as index
# By setting a custom index page
plugins: []

# Optional: Add your GitHub Pages URL
# url: "https://adamanuhu.github.io"
# baseurl: "/cs12-wifi-security"
